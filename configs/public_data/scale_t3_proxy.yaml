name: scale_t3_proxy
cache_dir: .cache/huggingface
streaming: false
offline: false
row_offset: 900
max_train_examples_per_dataset: 128
max_validation_examples_per_dataset: 0
max_test_examples_per_dataset: 0
clients_per_dataset: 1
partition:
  strategy: dirichlet
  dirichlet_alpha: 0.5
  min_examples_per_client: 4
  size_imbalance: 0.0
split:
  support_ratio: 0.25
  query_ratio: 0.25
  validation_ratio: 0.25
  test_ratio: 0.25
tasks:
- task_id: sst2_sentiment
  dataset_path: nyu-mll/glue
  dataset_name: sst2
  task_type: classification
  input_fields:
  - sentence
  target_field: label
  metric: accuracy
  description:
    op: sentiment_classification
    in: sentence
    out: yes_no_label
    dom: movie_review
    lang: en
- task_id: ag_news_topic
  dataset_path: fancyzhx/ag_news
  dataset_name: null
  task_type: classification
  input_fields:
  - text
  target_field: label
  metric: accuracy
  description:
    op: topic_classification
    in: news_article
    out: categorical_label
    dom: news
    lang: en
- task_id: glue_rte
  dataset_path: nyu-mll/glue
  dataset_name: rte
  task_type: natural_language_inference
  input_fields:
  - sentence1
  - sentence2
  target_field: label
  metric: accuracy
  description:
    op: textual_entailment
    in: premise_and_hypothesis
    out: yes_no_label
    dom: news_and_wikipedia
    lang: en
text_template:
  include_task_prefix: true
  max_source_length: 384
  max_target_length: 96
