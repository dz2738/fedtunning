[project]
name = "fedtaskprompt"
version = "0.1.0"
description = "A single-process research prototype for semantic-aware heterogeneous federated soft prompt learning."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "accelerate>=1.2,<3",
    "datasets>=3.2,<4",
    "evaluate>=0.4.3,<1",
    "hydra-core>=1.3.2,<2",
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "rich>=13.9,<15",
    "safetensors>=0.4.5,<1",
    "scikit-learn>=1.5,<2",
    "scipy>=1.13,<2",
    "sentencepiece>=0.2,<1",
    "tensorboard>=2.18,<3",
    "torch>=2.5,<3",
    "tqdm>=4.66,<5",
    "transformers>=4.48,<6",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data", "model", "client", "server", "trainer", "metrics", "baselines"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

