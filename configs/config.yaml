defaults:
  - data: prototype
  - public_data: prototype_proxy
  - model: flan_t5_base
  - method: fedtaskprompt
  - experiment: main
  - _self_

seed: 42
run_id: ${now:%Y%m%d_%H%M%S}
device: auto
precision: bf16
num_workers: 2
deterministic: false

output_dir: outputs/${experiment.name}/seed_${seed}/${run_id}

logging:
  level: INFO
  log_every_rounds: 1
  tensorboard: true
  save_client_metrics: true

checkpoint:
  save_every_rounds: 10
  keep_last: 2
  resume_from: null

hydra:
  run:
    dir: ${output_dir}
  job:
    chdir: false
  output_subdir: hydra

